name: CI

# Every job name says whether it blocks the merge. A green check that gates
# nothing teaches contributors that the check does not matter, and then the
# one that does matter gets ignored too — so "(blocking)" and "(advisory)"
# are part of the name rather than something you learn by reading branch
# protection settings.
#
# Step logic lives in .github/scripts/*.sh, which
# .github/scripts/scripts_test.sh exercises locally. A step written inline
# here can only be tested by pushing.

on:
  push:
    branches: [main, 'phase-*/*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Windows is ADVISORY, the other two block. That asymmetry is deliberate
    # and should be removed, not made permanent.
    #
    # This matrix was added by issue #121 and Windows went red on its first
    # run. The compile break it found (syscall.Flock, which does not exist
    # there) is fixed. What remained was a set of pre-existing test failures
    # across internal/adapters and packages/codeindex/{go,py,ts}. None of it
    # came from the work that added this job; it was invisible because
    # nothing had ever built this repo on Windows.
    #
    # Making the whole matrix advisory would have thrown away the ubuntu and
    # macos signal to accommodate one platform. Making Windows blocking today
    # would red-X every PR for a backlog none of them created. So Windows
    # reports and does not gate, and issue #143 tracks turning it back on --
    # at which point `continue-on-error` comes out and the name loses its
    # suffix.
    #
    # FIXED so far (#143):
    #   - The shell-metacharacter guard that rejected the backslash in every
    #     Windows temp path (packages/codeindex/{py,ts}: buildScannerArgs
    #     now normalises separators before validating).
    #   - The absolute-path check that rejected a drive letter
    #     (validatePythonBin).
    #   - Report-supplied paths routed through the host's filepath, which
    #     made a Playwright feature id depend on the runner
    #     (internal/adapters/pathnorm.go).
    #   - The golden snapshot's line endings, which a core.autocrlf=true
    #     checkout rewrote to CRLF: .gitattributes now pins them, and the
    #     test says so instead of printing a phantom diff.
    #
    # NOT a real failure, contrary to the earlier version of this comment:
    # "path separators baked into a golden snapshot". Every path in that
    # snapshot has already been through filepath.ToSlash at construction.
    # Measured, not assumed -- see docs/testing/determinism.md, "The
    # snapshot on Windows".
    #
    # STILL UNVERIFIED, and why this leg is still advisory: none of the
    # above has been observed passing ON Windows -- it was all developed and
    # mutation-tested from Linux. One concrete suspect remains unexamined:
    # packages/resolver keys its file lookup (Program.byPath) on absolute
    # paths, inserting what `go list` reports and querying with what
    # filepath.WalkDir produced. filepath.Clean does not reconcile a
    # drive-letter case difference or an 8.3 short name (RUNNER~1) between
    # those two sources, and a miss there is silent: every edge degrades out
    # of `typed`, which moves the golden snapshot on Windows only. Flip this
    # gate when a Windows run is green, not before.
    name: build + test + lint — ${{ matrix.os }} ${{ matrix.gate }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gate: "(blocking)"
            advisory: false
          - os: macos-latest
            gate: "(blocking)"
            advisory: false
          - os: windows-latest
            gate: "(ADVISORY - Windows portability, see issue 143)"
            advisory: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned Go toolchain
        id: toolchain
        shell: bash
        # One source of truth for the Go version: .github/scripts/toolchain.txt.
        # go.mod's `go 1.25.0` is a language-version floor, not a toolchain
        # pin, and a floor is not enough for reproducible output — two patch
        # releases of Go do not produce the same bytes.
        run: echo "version=$(tr -d '[:space:]' < .github/scripts/toolchain.txt)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Install sqlc
        # Linux only: sqlc's generated output is platform-independent, so
        # checking it three times costs three installs and proves nothing
        # the first one did not.
        if: runner.os == 'Linux'
        # Pin to the version used to generate packages/store/sqlc/ —
        # bumping requires running `sqlc generate` and reviewing the diff.
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: sqlc diff (generated code is up to date)
        # Fails when packages/store/queries/*.sql has been edited but the
        # generated code in packages/store/sqlc/ wasn't regenerated. Run
        # `cd packages/store && sqlc generate` locally and commit the
        # output to fix.
        if: runner.os == 'Linux'
        working-directory: packages/store
        run: sqlc diff

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race + coverprofile, Linux)
        # The race detector needs cgo and a C toolchain. That is fine on
        # Linux and macOS; on Windows it would mean shipping a gcc
        # dependency into a project whose whole point is that it needs no C
        # compiler. Windows therefore runs the same suite without -race,
        # and the race coverage comes from the other two platforms.
        #
        # Linux additionally writes a coverprofile, because the dogfood job
        # below needs one for THIS repo and generating it there would mean
        # running the whole suite a second time to measure the same code.
        # -coverpkg is what makes the profile cover the packages under test
        # rather than only the ones each test binary happens to link.
        if: runner.os == 'Linux'
        run: |
          go test ./... -race -timeout 20m \
            -coverprofile=cover.coverprofile \
            -coverpkg=./packages/...,./internal/...

      - name: go test (race, macOS)
        if: runner.os == 'macOS'
        run: go test ./... -race -timeout 10m

      - name: go test (no race, Windows)
        if: runner.os == 'Windows'
        run: go test ./... -timeout 10m

      - name: go test (integration tag)
        # Runs the framework-parser integration tests added in W2-E.
        # Scoped to packages/coverage/... so TestIngest_NutritionDogfood
        # (which requires the nutrition-v2-go checkout) is excluded.
        if: runner.os == 'Linux'
        run: go test -tags=integration ./packages/coverage/... -race -timeout 5m

      - name: Upload the coverprofile for the dogfood gate
        # Named for its one consumer. if-no-files-found: error rather than the
        # default warning: a silently missing profile would make the dogfood
        # job either skip or regenerate, and a gate that quietly stops
        # measuring is the failure this whole layer exists to prevent.
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-coverprofile
          path: cover.coverprofile
          if-no-files-found: error
          retention-days: 1

      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          # golangci-lint v2.12.x is built with Go 1.26 and supports go.mod
          # targeting >= 1.25 (our current target). Earlier v2.0.x was built
          # against Go 1.24 and refused to load configs whose go.mod target
          # was 1.25+. Bumping the patch line forward keeps us ahead of the
          # Go toolchain we build the binary with.
          version: v2.12.2
          args: --timeout=5m

  supply-chain:
    name: reproducible build + cross-compile + release scripts (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # verify-repro.sh derives SOURCE_DATE_EPOCH from HEAD's committer
          # date and the version from `git describe`, so it needs history
          # and tags rather than the default single-commit checkout.
          fetch-depth: 0

      - name: Read the pinned Go toolchain
        id: toolchain
        run: echo "version=$(tr -d '[:space:]' < .github/scripts/toolchain.txt)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: true

      # This single command covers: the helper unit tests, the six-target
      # cross-compile with its cgo-free assertion, the build-twice digest
      # comparison, workflow YAML parsing, and the "every action is pinned
      # to a SHA" check. All of it runs identically via `make
      # test-scripts-full` on a laptop.
      - name: Install gitleaks
        # scripts_test.sh exercises secret-scan.sh, and those tests SKIP when
        # gitleaks is absent rather than pass vacuously. Installing it here is
        # what makes them run in this job instead of quietly reporting "skip".
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0

      - name: Release scripts + reproducibility + cross-compile
        run: make test-scripts-full

  determinism:
    name: scan determinism (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned Go toolchain
        id: toolchain
        run: echo "version=$(tr -d '[:space:]' < .github/scripts/toolchain.txt)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: true

      # The determinism suite from #120 (docs/testing/determinism.md) also
      # runs inside `go test ./...` above. It gets its own job because
      # "atlas produced a different answer for the same input" is a
      # different kind of failure from "a test broke", and a reviewer
      # looking at a red X should be able to tell which happened without
      # opening the log. -count=1 defeats the test cache: a cached pass
      # would report determinism nobody re-measured.
      - name: Determinism suite
        run: go test ./packages/codeindex/... ./packages/store/... -run Determinism -count=1 -v -timeout 10m

  secret-scan:
    name: secret scan (blocking)
    # Atlas ships a secret detector, so its own fixtures look like credentials.
    # A literal AWS temporary key id in packages/redact raised a real GitHub
    # secret-scanning alert after the M4 batch merged. Nothing leaked -- the
    # value never was a credential -- but an alert nobody can distinguish from
    # a real one is the whole cost, and a maintainer who learns to dismiss
    # alerts is the actual failure.
    #
    # This catches that class before it reaches GitHub's scanner, where nothing
    # is configurable. The logic is in .github/scripts/secret-scan.sh so a
    # contributor runs the identical check locally -- same pinned version, same
    # config, same answer.
    #
    # Blocking from the start. A secret-scanning gate that only warns trains
    # exactly the habit it exists to prevent.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # History mode needs the history. Shallow would scan one commit and
          # report clean, which is worse than not running.
          fetch-depth: 0

      - name: Read the pinned Go toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/scripts/toolchain.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}

      - name: Install gitleaks
        # Installed from source at a pinned version rather than pulling a
        # third-party action: this repo already builds its own tools, and an
        # action is one more thing to pin, audit and keep pinned.
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0

      - name: Scan history for committed credentials
        env:
          SCAN_MODE: history
        run: ./.github/scripts/secret-scan.sh

  dogfood:
    name: atlas gates atlas (blocking)
    # Issue #122's acceptance criterion is that CI goes red when the dogfood
    # numbers regress, so this job blocks. Before it existed the suite behind
    # test/acceptance/run.sh ran in no pipeline at all: it is behind the
    # `dogfood` build tag, which `go test ./...` does not set, so the headline
    # deliverable of the test-strategy work was executing nowhere.
    #
    # Separate job rather than a step in build-and-test because "atlas
    # reported the wrong thing about atlas" is a different failure from "a
    # test broke", and a reviewer looking at a red X should be able to tell
    # which without opening a log. It needs build-and-test only for that
    # job's coverprofile.
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `atlas cov diff` compares against a base ref. The default
          # single-commit checkout has neither origin/main nor HEAD~1, and
          # run.sh would then hand the suite an empty base — which it reports
          # as not-applicable rather than failing, i.e. a green gate that
          # measured one assertion fewer than it looks like it did.
          fetch-depth: 0

      - name: Read the pinned Go toolchain
        id: toolchain
        run: echo "version=$(tr -d '[:space:]' < .github/scripts/toolchain.txt)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: true

      - name: Download the coverprofile from the test job
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: repo-coverprofile

      - name: atlas gates atlas
        # run.sh generates a profile when ATLAS_DOGFOOD_PROFILE is unset,
        # which costs a second full `go test`. Passing the one build-and-test
        # already produced is the whole reason for the artifact above.
        env:
          ATLAS_DOGFOOD_PROFILE: ${{ github.workspace }}/cover.coverprofile
        run: ./test/acceptance/run.sh

  version-consistency:
    name: version / manifest / changelog agree (ADVISORY — known failing, see docs/releasing.md)
    runs-on: ubuntu-latest
    # Advisory on purpose, and named so nobody has to guess. As of this
    # workflow landing, internal/cli.Version, .release-please-manifest.json
    # and CHANGELOG.md disagree — that predates this job and is exactly what
    # issue #121 asks to be made visible. Making it blocking now would red-X
    # every PR for a defect none of them introduced. docs/releasing.md says
    # what the one-time fix is; once it lands, delete continue-on-error and
    # drop ADVISORY from the name.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check version sources agree
        run: .github/scripts/check-version-consistency.sh

  docs-claims:
    name: published claims still hold (blocking)
    # Issue #147. Twice, a fabricated claim shipped: an invented worked example
    # in docs/commands/hotspots.md, and an `atlas version` transcript in
    # docs/install.md captioned with a command that printed something else.
    # Both were caught by a human reading docs against code. Neither would ever
    # have been caught here, because nothing in CI read the docs.
    #
    # Its own job rather than a step in build-and-test, for the same reason the
    # dogfood job is separate: "the documentation says something untrue" is a
    # different failure from "a test broke", and a reviewer looking at a red X
    # should be able to tell which without opening a log.
    #
    # Blocking from the start. The rule this replaces -- do not publish a
    # number you did not measure -- already existed as prose, and was violated
    # twice by people who had read it. An advisory version would be the same
    # prose with a yellow icon.
    #
    # No coverprofile, no state database, no network: the guard reads markdown
    # and the source files its probes derive counts from, and re-runs a handful
    # of --help transcripts in process. What it does NOT check is written down
    # in docs/testing/claims.md, and that page is part of the deliverable.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned Go toolchain
        id: toolchain
        run: echo "version=$(tr -d '[:space:]' < .github/scripts/toolchain.txt)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: true

      - name: Check every published claim against the code it describes
        run: make check-docs
